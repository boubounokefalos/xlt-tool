name: Feature request
description: An idea for something XLT Tool could do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Ideas are welcome! Please check the [open issues](https://github.com/boubounokefalos/xlt-tool/issues) first, in case someone already asked.
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What XLT Tool should do, and where (Library, Convert, the ⋮ menu…).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Examples from other apps, sketches, screenshots.
